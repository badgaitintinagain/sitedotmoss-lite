<nav x-data="{ mobileMenuOpen: false }" class="h-11 flex items-center justify-between lg:justify-center z-50 fixed bg-white w-full bg-opacity-90 backdrop-blur-sm top-0 left-0 border-b border-gray-100">

        </a>
    </div>

    <!-- Desktop Logo -->
    <div class="hidden lg:flex mr-8 block">
        <a href="#" class="hover:opacity-70 flex items-center justify-center">
            <img src="/favicon.ico" alt="Logo" class="w-5 h-5 object-contain" />
        </a>
    </div>

    <!-- Desktop Links -->
    <div class="hidden lg:flex space-x-8 text-xs tracking-wide text-gray-800">
        <a href="#ai-lab" class="hover:text-black transition-colors">AI lab</a>
        <a href="#work-focus" class="hover:text-black transition-colors">Work & Focus</a>

    <div class="mr-4 lg:mr-0 ml-8 flex space-x-5 items-center">
        <button class="hover:opacity-70">

            <svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="1.5" class="w-4 h-4 text-black" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607z"/></svg>

        <button class="flex lg:hidden hover:opacity-70 text-black" @click="mobileMenuOpen = !mobileMenuOpen">

            <svg x-show="!mobileMenuOpen" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 9h16.5m-16.5 6.75h16.5" /></svg>

    <!-- Mobile Menu Dropdown -->
    <div x-show="mobileMenuOpen" 
         style="display:none;" 
         x-transition:enter="transition ease-out duration-200"
         x-transition:enter-start="opacity-0 -translate-y-5"
         x-transition:enter-end="opacity-100 translate-y-0"

        <div class="flex flex-col space-y-4 text-2xl font-bold tracking-tight">

            <a href="#work-focus" @click="mobileMenuOpen = false" class="border-b border-gray-200 pb-3 hover:text-gray-500">Work & Focus</a>
